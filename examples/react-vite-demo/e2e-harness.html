<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatchLens E2E Harness</title>
  </head>
  <body>
    <iframe id="preview" title="PatchLens preview"></iframe>
    <script type="module">
      const frame = document.querySelector('#preview');
      const messages = [];
      window.patchLensMessages = messages;
      window.addEventListener('message', (event) => {
        if (event.source === frame.contentWindow && event.origin === location.origin) {
          messages.push(event.data);
        }
      });
      window.enablePatchLens = () => {
        frame.contentWindow.postMessage(
          {
            source: 'patchlens-ai',
            schemaVersion: 1,
            messageId: crypto.randomUUID(),
            channelId: 'e2e-channel',
            projectId: 'e2e-project',
            type: 'studio:set-inspector-mode',
            payload: { enabled: true },
          },
          location.origin,
        );
      };
      const query = new URLSearchParams({
        patchlensProjectId: 'e2e-project',
        patchlensChannelId: 'e2e-channel',
        patchlensStudioOrigin: location.origin,
      });
      frame.src = `/?${query}`;
    </script>
  </body>
</html>
